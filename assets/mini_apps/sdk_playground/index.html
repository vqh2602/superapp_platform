    <script></script>
    <style rel="stylesheet" crossorigin>:root{--primary: #2563eb;--primary-hover: #1d4ed8;--secondary: #0f172a;--bg-color: #f8fafc;--card-bg: #ffffff;--border-color: #e2e8f0;--text-main: #0f172a;--text-muted: #64748b;--accent-green: #10b981;--accent-red: #ef4444;--accent-amber: #f59e0b}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg-color);color:var(--text-main);line-height:1.5;-webkit-font-smoothing:antialiased}.playground-app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background-color:#fff;border-left:1px solid var(--border-color);border-right:1px solid var(--border-color)}.header-container{padding:16px 20px;background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff}.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.app-title-group{display:flex;align-items:center;gap:12px}.app-icon-badge{background:var(--primary);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}.app-title{font-size:17px;font-weight:800;letter-spacing:-.3px}.app-subtitle{font-size:11px;color:#94a3b8}.version-tag{background:#ffffff26;font-size:11px;font-weight:600;padding:3px 8px;border-radius:12px}.status-bar{display:flex;flex-wrap:wrap;gap:8px}.status-pill{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:16px;font-size:11px;font-weight:600}.status-connected{background:#10b98133;color:#34d399}.status-simulated{background:#f59e0b33;color:#fbbf24}.status-auth{background:#2563eb33;color:#60a5fa}.status-no-auth{background:#ef444433;color:#f87171}.status-secure{background:#ffffff1a;color:#cbd5e1}.tab-bar{display:flex;border-bottom:1px solid var(--border-color);background:#fff;position:sticky;top:0;z-index:10}.tab-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 6px;background:none;border:none;border-bottom:2px solid transparent;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .2s}.tab-btn:hover{color:var(--primary)}.tab-btn.tab-active{color:var(--primary);border-bottom-color:var(--primary)}.main-content{flex:1;padding:16px;background-color:var(--bg-color)}.catalog-wrapper{display:flex;flex-direction:column;gap:20px}.category-section{display:flex;flex-direction:column;gap:10px}.category-header{display:flex;align-items:center;gap:8px;padding-bottom:4px}.category-icon{color:var(--primary)}.category-title{font-size:14px;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:.5px}.feature-grid{display:flex;flex-direction:column;gap:10px}.feature-card{display:flex;align-items:center;background:#fff;border:1px solid var(--border-color);border-radius:12px;padding:14px;gap:12px;transition:transform .15s,box-shadow .15s}.feature-card:active{transform:scale(.99)}.feature-card-danger{border-left:3px solid var(--accent-red)}.feature-icon-wrapper{background:#f1f5f9;color:var(--primary);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.feature-content{flex:1;min-width:0}.feature-title-row{display:flex;align-items:center;gap:8px;margin-bottom:2px}.feature-name{font-size:14px;font-weight:700;color:var(--text-main)}.status-tag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:6px}.tag-ready{background:#f1f5f9;color:#475569}.tag-danger{background:#fee2e2;color:#dc2626}.feature-desc{font-size:12px;color:var(--text-muted);margin-bottom:4px}.feature-code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10px;color:#6366f1;background:#eef2ff;padding:1px 5px;border-radius:4px}.run-demo-btn{display:flex;align-items:center;gap:4px;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}.run-demo-btn.btn-danger{background:var(--accent-red)}.modal-backdrop{position:fixed;top:0;right:0;bottom:0;left:0;background:#0f172a99;display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadeIn .15s ease-out}.modal-card{background:#fff;width:100%;max-width:600px;max-height:85vh;border-top-left-radius:20px;border-top-right-radius:20px;padding:20px;overflow-y:auto;box-shadow:0 -10px 25px #0003;display:flex;flex-direction:column;gap:14px;animation:slideUp .2s ease-out}.modal-header{display:flex;justify-content:space-between;align-items:flex-start}.modal-category{font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase}.modal-title{font-size:18px;font-weight:800}.modal-code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;color:#6366f1;background:#eef2ff;padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px}.modal-desc{font-size:13px;color:var(--text-muted)}.param-section{display:flex;flex-direction:column;gap:6px}.section-label{font-size:12px;font-weight:700;color:#475569}.param-textarea{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;padding:10px;border:1px solid var(--border-color);border-radius:8px;background:#f8fafc;resize:vertical}.action-row{display:flex;align-items:center;gap:10px}.primary-btn{display:flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer}.primary-btn:disabled{opacity:.6;cursor:not-allowed}.secondary-btn{display:flex;align-items:center;gap:6px;background:#f1f5f9;color:#334155;border:1px solid var(--border-color);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer}.icon-btn{background:#f1f5f9;border:none;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}.icon-btn-sm{background:transparent;border:none;cursor:pointer;padding:4px;border-radius:4px}.exec-time-badge{display:flex;align-items:center;gap: flex;flex-direction:column;gap:16px}.simulation-toolbar{background:#fff;border:1px solid var(--border-color);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}.toolbar-header{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#475569}.sim-buttons-grid{display:flex;flex-wrap:wrap;gap:8px}.sim-btn{display:flex;align-items:center;gap:5px;background:#f1f5f9;color:#334155;border:1px solid var(--border-color);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer}.sim-btn:hover{background:#e2e8f0}.sim-btn-warning{color:#b45309;background:#fef3c7;border-color:#fde68a}.log-entry-item{border:1px solid var(--border-color);border-radius:8px;padding:10px;background:#fff}.log-entry-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.log-left{display:flex;align-items:center;gap:8px}.method-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff}.bg-success{background:#16a34a}.bg-danger{background:#dc2626}.log-time,.log-duration{font-size:11px;color:var(--text-muted);font-family:ui-monospace,SFMono-Regular,monospace}.log-subfield{display:flex;flex-direction:column;margin-top:4px;font-size:11px}.subfield-label{font-weight:600;color:#64748b;margin-bottom:2px}.subfield-code{font-family:ui-monospace,SFMono-Regular,monospace;background:#f8fafc;padding:4px 6px;border-radius:4px;color:#334155}.subfield-pre{font-family:ui-monospace,SFMono-Regular,monospace;background:#f8fafc;padding:6px;border-radius:6px;color:#334155;max-height:120px;overflow:auto}.empty-hint{text-align:center;padding:30px;color:#94a3b8;font-size:13px}.spin{animation:spin 1s linear infinite}@keyframes spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes fadeIn{0%{opacity:0}to{opacity:1}}@keyframes slideUp{0%{transform:translateY(100%)}to{transform:translateY(0)}}</style>
