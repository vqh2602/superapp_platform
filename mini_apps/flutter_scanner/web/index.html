<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flutter Scanner (Flutter Web)</title>
  <link rel="manifest" href="manifest.json">
  <script>
    window.__WEBVIEW_LOGS__ = window.__WEBVIEW_LOGS__ || [];
    function __sendEarlyLog(entry) {
      window.__WEBVIEW_LOGS__.push(entry);
      try {
        if (window.__SuperAppWebDebug__ && window.__SuperAppWebDebug__.postMessage) {
          window.__SuperAppWebDebug__.postMessage(JSON.stringify(entry));
        }
      } catch (_) {}
    }
    window.addEventListener('error', function(e) {
      var target = e.target;
      var resource = target && (target.src || target.href);
      var msg = resource ? ('Failed to load ' + (target.tagName || 'resource') + ': ' + resource) : (e.message || 'Script Error');
      if (e.filename) msg += ' at ' + e.filename + ':' + (e.lineno || '') + ':' + (e.colno || '');
      __sendEarlyLog({
        id: 'early_err_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        type: 'error',
        level: 'error',
        message: msg,
        stack: e.error && e.error.stack ? e.error.stack : null,
        timeMs: Date.now()
      });
    }, true);
    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'Unknown rejection';
      __sendEarlyLog({
        id: 'early_rej_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        type: 'unhandledrejection',
        level: 'error',
        message: '[Unhandled Rejection] ' + reason,
        stack: e.reason && e.reason.stack ? e.reason.stack : null,
        timeMs: Date.now()
      });
    });
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #0068FF;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 104, 255, 0.2);
      border-top-color: #0068FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p style="margin-top: 14px; font-size: 13px; font-weight: 600; color: #64748B;">Đang khởi chạy Flutter Web...</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
